server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API y documentación → backend
  location /api/ { proxy_pass http://backend:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /docs { proxy_pass http://backend:4000; proxy_set_header Host $host; }

  # Recursos con hash: caché larga
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # SPA
  location / { try_files $uri /index.html; }
}
